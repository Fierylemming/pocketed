name: Check Pocketed

on:
  pull_request:
  push:
    branches-ignore: [main]
  # Re-check the locked dependencies for newly published advisories, even
  # when there are no code changes. This workflow never deploys or uses secrets.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm run audit
      - name: Tests, type checks, and production build
        run: npm run check
