# Every push to main: run all tests, redeploy the sync server (Workers + D1)
# and republish the website (Pages).
#
# Repository SECRETS needed (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   custom token: Account > Workers Scripts: Edit,
#                          Account > D1: Edit, Account > Pages: Edit,
#                          Account > Account Settings: Read
#   CLOUDFLARE_ACCOUNT_ID  shown on the Workers & Pages overview page
#
# Repository VARIABLES (same page, "Variables" tab):
#   WORKER_URL     e.g. https://pocketed-maxha.workers.dev   (baked into the site so it never asks for an address)
#   PAGES_PROJECT  the Pages project name you created once, e.g. pocketed-fierylemming

name: Deploy Pocketed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm run audit

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build website
        run: npm run build:web
        env:
          VITE_SERVER_URL: ${{ vars.WORKER_URL }}

      - name: Deploy sync server (Workers + D1)
        run: npm run deploy:server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish website (Pages)
        run: npx wrangler pages deploy web/dist --project-name=${{ vars.PAGES_PROJECT || 'pocketed' }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
